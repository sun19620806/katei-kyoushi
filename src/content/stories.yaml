# かけ算の文章題のもと。{a} = 1つ分の数、{b} = いくつ分。
# 答えの単位を unit に書く。好きなもの（恐竜・サッカーなど）の話は、先生会議で足していく。
# 1文は90文字以内。漢字は2年生までに習うものだけ。

stories:
  - text: "1さらに いちごが {a}こずつ のっています。{b}さら では、いちごは ぜんぶで なんこ？"
    unit: こ
  - text: "1はこに えんぴつが {a}本ずつ はいっています。{b}はこ では、えんぴつは ぜんぶで なん本？"
    unit: 本
  - text: "ながいすに 1きゃく {a}人ずつ すわります。{b}きゃく では、ぜんぶで なん人 すわれる？"
    unit: 人
  - text: "1ふくろに あめが {a}こずつ はいっています。{b}ふくろ では、あめは ぜんぶで なんこ？"
    unit: こ
  - text: "{a}cmの テープの {b}ばいの 長さは なんcm？"
    unit: cm
  - text: "1まいの カードに シールを {a}まいずつ はります。カード {b}まい では、シールは ぜんぶで なんまい？"
    unit: まい
  - text: "サッカーの チームは 1チーム {a}人 です。{b}チーム では、ぜんぶで なん人？"
    unit: 人
  - text: "1しゅうかんに ほんを {a}さつずつ よみます。{b}しゅうかん では、ぜんぶで なんさつ？"
    unit: さつ
  - text: "きょうりゅうの たまごが 1つの すに {a}こずつ あります。すが {b}こ では、たまごは ぜんぶで なんこ？"
    unit: こ
  - text: "1だいの くるまに {a}人ずつ のります。くるま {b}だい では、ぜんぶで なん人 のれる？"
    unit: 人
  - text: "1れつに いすを {a}こずつ ならべます。{b}れつ では、いすは ぜんぶで なんこ？"
    unit: こ
  - text: "1日に {a}ページずつ ドリルを します。{b}日 では、ぜんぶで なんページ？"
    unit: ページ
