# かけ算の文章題のもと。{a} = 1つ分の数、{b} = いくつ分。
# 答えの単位を unit に書く。好きなもの（恐竜・サッカーなど）の話は、先生会議で足していく。
# 1文は90文字以内。漢字は2年生までに習うものだけ。

stories:
