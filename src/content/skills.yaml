# スキルの地図（算数・国語、小2 2学期から）
# 並び順＝重点にする順番（前提スキルの習熟度が十分になったら次へ）。
# review: true は1学期までの内容。重点にはせず、ウォームアップと復習にだけ出す。
version: "2026-09-15.3"

misconceptions:
  # たし算・ひき算
  - id: no_carry
    label: くり上がりの1を足し忘れる
  - id: concat_ones
    label: 一の位の合計をそのまま書く（例 38+25→513）
  - id: count_slip
    label: 数え足しで1ずれる
  - id: smaller_from_larger
    label: 各位で大きい数から小さい数を引いてしまう
  - id: borrow_no_decrement
    label: 上の位から借りたのに、その位を減らし忘れる
  - id: calc_slip
    label: 計算のうっかり（1ずれ）
  # かけ算
  - id: neighbor_fact
    label: となりの九九と取り違える（例 7×8→49 や 63）
  - id: neighbor_dan
    label: となりの段と取り違える（例 7×8→48）
  - id: add_instead
    label: かけ算ではなく足し算をしてしまう
  - id: product_minus
    label: □を求めるとき、積から引き算してしまう（例 □×7=42 → 35）
  - id: order_reversed
    label: 式が「いくつ分×1つ分」の順になっている
  # 長さ・かさ（m_as_10cm / cm_whole は v0.2 までの記録用）
  - id: m_as_10cm
    label: 1mを10cmと考えてしまう
  - id: cm_whole
    label: 「□m□cm」の□cmに、全部のcmを書いてしまう
  - id: ratio_wrong
    label: 単位の関係（1m=100cm、1L=10dL など）を取りちがえる
  - id: small_whole
    label: 「□m□cm」などの小さい単位に、全部の数を書いてしまう
  # 時こくと時間
  - id: hands_swapped
    label: 長いはりと短いはりを取りちがえる
  - id: hour_ahead
    label: 短いはりが次の数字に近いと、次の時と読んでしまう
  - id: minute_as_number
    label: 長いはりがさす数字を、そのまま「分」と読んでしまう
  - id: no_hour_carry
    label: 12をまたぐときに、時をかえ忘れる（3時70分など）
  - id: hour_as_100
    label: 1時間を100分と考えてしまう
  - id: before_after_mix
    label: 「前」と「後」を取りちがえる
  # 分数
  - id: gave_denominator
    label: 1/4 の「4」をそのまま答えにしてしまう
  - id: used_half
    label: どの分数でも半分にしてしまう
  - id: subtracted
    label: 分けるかわりに、ひき算をしてしまう
  - id: unequal_parts
    label: 同じ大きさに分けていない図を選ぶ
  - id: wrong_count
    label: いくつに分けたかを数えまちがえる
  - id: shaded_count
    label: 色をぬった数（1つ分）を見ていない
  # 大きい数
  - id: zero_miss
    label: 0この位に「0」を書かない（3052→352）
  - id: ones_first
    label: 大きい数を くらべるとき、一の位から くらべてしまう
  - id: sign_reversed
    label: ＞と＜の 向きを 取りちがえる
  - id: place_misalign
    label: 筆算で 位を そろえずに 書く（245+38 → 625）
  - id: op_reversed
    label: たし算と ひき算を 取りちがえる（文章題）
  - id: one_more
    label: かける数が1ふえると、答えも1ふえると 考える
  - id: gave_product
    label: きかれていない 九九の 答えを 書く
  - id: same_number
    label: □に、見えている 同じ数を 書く
  # 形
  - id: open_shape
    label: 線がつながっていない形を選ぶ
  - id: curved_side
    label: まがった線がある形を選ぶ
  - id: side_count
    label: 辺の数を数えまちがえる
  - id: no_right_angle
    label: 直角がない形を選ぶ
  - id: unequal_sides
    label: 辺の長さが同じかを見ていない（長方形と正方形）
  # 国語
  - id: sokuon_miss
    label: 小さい「っ」がぬける・よけいに入る
  - id: long_vowel_miss
    label: のばす音（う・い・ー）がぬける・よけいにつく
  - id: dakuten_miss
    label: 「゛」「゜」がぬける・よけいにつく
  - id: youon_miss
    label: 小さい「ゃ・ゅ・ょ」の書きまちがい
  - id: on_kun_mix
    label: 音読みと訓読みを取りちがえる
  - id: similar_kanji
    label: 形のにた漢字と取りちがえる
  - id: homophone
    label: 読みが同じ別の漢字を選ぶ
  - id: okurigana
    label: 送りがなのまちがい
  - id: similar_katakana
    label: 形のにたかたかな（シとツ、ソとン など）を取りちがえる
  - id: predicate_for_subject
    label: 主語をきかれて述語を選ぶ
  - id: subject_for_predicate
    label: 述語をきかれて主語を選ぶ
  - id: modifier_chosen
    label: 主語・述語ではない、くわしくする言葉を選ぶ
  - id: not_in_text
    label: 文章に書いていないことを選ぶ
  - id: wrong_part
    label: 文章のちがう場面・段落のことを選ぶ
  - id: word_match
    label: 同じ言葉が入っているだけの選択肢を選ぶ
  - id: particle_sound
    label: 「は・を・へ」を、音のとおり「わ・お・え」と書く
  - id: particle_overuse
    label: ことばの一部なのに「は・を・へ」と書く
  - id: particle_other
    label: 文に合わない助詞（が・に など）を選ぶ
  - id: similar_meaning
    label: はんたいの言葉をきかれて、にた意味の言葉を選ぶ
  - id: related_not_opposite
    label: 関係はあるが、はんたいではない言葉を選ぶ
  - id: group_other
    label: べつの なかまの 言葉を選ぶ
  - id: group_name
    label: なかまの名前そのもの（大きな なかま）を選ぶ
  - id: who_confused
    label: 登場人物（説明しているもの）を取りちがえる

