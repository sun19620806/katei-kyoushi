# スキルの地図（算数・MVP）
# 前提スキル(prereqs)の習熟度が十分になってから、次のスキルを重点にする。
version: "2026-09-14.1"

misconceptions:
  - id: no_carry
    label: 繰り上がりの1を足し忘れる
  - id: concat_ones
    label: 一の位の合計をそのまま書く（例 38+25→513）
  - id: count_slip
    label: 数え足しで1ずれる
  - id: smaller_from_larger
    label: 一の位で大きい数から小さい数を引いてしまう
  - id: borrow_no_decrement
    label: 十の位から借りたのに十の位を減らし忘れる
  - id: calc_slip
    label: 計算のうっかり（1ずれ）
  - id: neighbor_fact
    label: となりの九九と取り違える（例 7×8→49 や 63）
  - id: neighbor_dan
    label: となりの段と取り違える（例 7×8→48）
  - id: add_instead
    label: かけ算ではなく足し算をしてしまう

skills:
  - id: math.add.1d1d_carry
    subject: math
    label: たし算（1けた＋1けた・くり上がり）
    kidLabel: くりあがりの たしざん
    prereqs: []
    generator: add1d1dCarry
    misconceptions: [no_carry, count_slip]

  - id: math.add.2d2d_carry
    subject: math
    label: たし算の筆算（2けた・くり上がり）
    kidLabel: ひっさんの たしざん
    prereqs: [math.add.1d1d_carry]
    generator: add2d2dCarry
    misconceptions: [no_carry, concat_ones, calc_slip]

  - id: math.sub.2d2d_borrow
    subject: math
    label: ひき算の筆算（2けた・くり下がり）
    kidLabel: ひっさんの ひきざん
    prereqs: [math.add.2d2d_carry]
    generator: sub2d2dBorrow
    misconceptions: [smaller_from_larger, borrow_no_decrement, calc_slip]

  - id: math.mul.dan2
