# ようすを あらわす ことば。小2 2学期。
# sentence: {blank} を 1回 ふくむ 文。answer: 合う ことば（ひらがな or かたかな）
# mc: sound_mismatch（音と ようすが 合わない ことばを 選ぶ・雨が「ごろごろ」など）/ intensity_mismatch（ようすは にて いるが つよさや 大きさが 合わない・小雨に「ざあざあ」など）
# hint: 45文字以内、答えを そのまま 書かない
# 文章は すべて オリジナル。漢字は 小1・小2で 習う ものだけ。

items:
