# 読みとり（つづき）。rd025〜rd032。小2 2学期。
# genre: story = ものがたり / explain = せつめい文
# text: 本文（150〜260文字、2〜4だんらく。だんらくは 改行で 分ける。文節ごとに スペース）
# questions: 1つの 文章に 3問。answer は 22文字以内。
#   wrong: まちがいの せんたくし。mc = その答えを えらぶ 原因（skills.yaml の misconceptions の id）
#   hint: 3だんめの ヒント（45文字以内）。答えも、まちがいの せんたくしも そのまま 書かない。
# 文章は すべて オリジナル。漢字は 小1・小2で 習う ものだけ。

passages:
  # ───── ものがたり ─────
  - id: rd025
    genre: story
    title: "赤い ながぐつ"
    text: |
      雨の 朝、ゆうとさんは 赤い ながぐつを はいて 家を 出た。ぴちゃん ぴちゃん、水たまり。ぴちゃん ぴちゃん、また 水たまり。
      道の はしに、だんごむしが 一ぴき。ゆうとさんが そっと さわると、ころ ころ ころ、まるく なった。「おどろかせて ごめんね。」
      学校に つく ころ、雨が やんだ。見上げた 空には、大きな にじ。ゆうとさんの 赤い ながぐつも、にこにこ わらって いるようだった。
    questions:
      - ask: "水たまりの ところで、どんな 音が しましたか。"
        answer: "ぴちゃん ぴちゃん"
        wrong:
          - { text: "ころ ころ ころ", mc: wrong_part }
          - { text: "ざあざあ ざあざあ", mc: not_in_text }
        hint: "はじめの だんらくを 声に 出して 読もう。"
      - ask: "ゆうとさんが さわると、だんごむしは どう なりましたか。"
        answer: "まるく なった"
        wrong:
          - { text: "空を 見上げた", mc: wrong_part }
          - { text: "ゆっくり 歩いて にげた", mc: not_in_text }
          - { text: "ころんで ないた", mc: word_match }
        hint: "2つめの だんらくで、そっと さわった あとを 読もう。"
      - ask: "学校に つく ころ、空には なにが 見えましたか。"
        answer: "大きな にじ"
        wrong:
          - { text: "赤い ながぐつ", mc: wrong_part }
          - { text: "くろい 雨雲", mc: not_in_text }
          - { text: "空を とぶ だんごむし", mc: word_match }
        hint: "さいごの だんらくの、2つめの 文を 読もう。"

  - id: rd026
    genre: story
    title: "はじめての 自てん車"
    text: |
      日曜日、りなさんは 自てん車の れんしゅうを した。お父さんが 後ろを もって、「前を 見て こいでごらん。」と 言った。
      はじめは ぐらぐら ゆれて、何ども 足を ついた。ひざを すりむいて、なきそうに なった。その とき、弟の けいさんが 「おねえちゃん、がんばれ。」と 大きな 声で おうえんした。
      りなさんは もう 一ど ペダルを ふんだ。気が つくと、お父さんの 手は はなれて いた。りなさんは 一人で 公園を 一しゅう した。
    questions:
      - ask: "「前を 見て こいでごらん。」と 言ったのは だれですか。"
        answer: "お父さん"
        wrong:
          - { text: "弟の けいさん", mc: who_confused }
          - { text: "りなさん", mc: who_confused }
        hint: "はじめの だんらくで、自てん車の 後ろを もって いた 人を さがそう。"
      - ask: "りなさんが なきそうに なったのは どうしてですか。"
        answer: "ひざを すりむいたから"
        wrong:
          - { text: "弟に おうえんされたから", mc: wrong_part }
          - { text: "お父さんの 手が はなれたから", mc: wrong_part }
          - { text: "自てん車が こわれたから", mc: not_in_text }
        hint: "2つめの だんらくの、2つめの 文を 読もう。"
      - ask: "さいごに、りなさんは どう なりましたか。"
        answer: "一人で 公園を 一しゅう した"
        wrong:
          - { text: "何ども 足を ついた", mc: wrong_part }
          - { text: "お父さんと 公園で あそんだ", mc: word_match }
          - { text: "弟と 自てん車に のった", mc: not_in_text }
        hint: "さいごの だんらくの、おわりの 文を 読もう。"

  - id: rd027
    genre: story
    title: "ピーマンの ひみつ"
    text: |
      たくやさんは ピーマンが にがてだ。きゅうしょくに 出ると、いつも さいごまで のこして しまう。
      夏休み、おばあちゃんの はたけで ピーマンの なえを 見つけた。「水を あげて みる？」と 言われて、たくやさんは 毎朝 水やりを した。小さな 白い 花が さいて、やがて つやつや 光る ピーマンが なった。
      自分で とった ピーマンを、おばあちゃんが 肉と いっしょに いためて くれた。たくやさんは 目を つぶって 一口 食べた。「あれ、あまい。」おばあちゃんは にっこり わらった。
    questions:
      - ask: "きゅうしょくに ピーマンが 出ると、たくやさんは いつも どう しますか。"
        answer: "さいごまで のこす"
        wrong:
          - { text: "毎朝 水やりを する", mc: wrong_part }
          - { text: "目を つぶって 一口 食べる", mc: wrong_part }
          - { text: "友だちに あげる", mc: not_in_text }
        hint: "はじめの だんらくを 読みかえそう。"
      - ask: "ピーマンの なえを 見つけたのは どこですか。"
        answer: "おばあちゃんの はたけ"
        wrong:
          - { text: "学校の 花だん", mc: not_in_text }
          - { text: "きゅうしょくの 時間", mc: word_match }
        hint: "2つめの だんらくの、はじめの 文を 読もう。"
      - ask: "ピーマンを 一口 食べて、たくやさんは なんと 言いましたか。"
        answer: "あれ、あまい"
        wrong:
          - { text: "水を あげて みる？", mc: who_confused }
          - { text: "やっぱり にがい", mc: not_in_text }
        hint: "さいごの だんらくで、目を つぶって 食べた あとを 読もう。"

  - id: rd028
    genre: story
    title: "こぶたの おべんとう"
    text: |
      えんそくの 日、こぶたの ブウは、はらっぱに ついてから 気が ついた。おべんとうを 家に わすれて きたのだ。ブウは しょんぼり 木の 下に すわった。
      それを 見た やぎの メエは、自分の サンドイッチを 半分 くれた。りすの チロは どんぐりクッキーを 二まい、たぬきの ポンは りんごを 一こ わけて くれた。
      ブウの 前には、いろいろな 食べものが ならんだ。「みんな、ありがとう。」ブウは 大きな 声で 言って、みんなで いっしょに 食べた。いつもより ずっと おいしかった。
    questions:
      - ask: "ブウが しょんぼりしたのは どうしてですか。"
        answer: "おべんとうを わすれたから"
        wrong:
          - { text: "木の 下に すわったから", mc: wrong_part }
          - { text: "えんそくに 行けなかったから", mc: not_in_text }
          - { text: "おべんとうが おいしくなかったから", mc: word_match }
        hint: "はじめの だんらくの、2つめの 文を 読もう。"
      - ask: "りんごを わけて くれたのは だれですか。"
        answer: "たぬきの ポン"
        wrong:
          - { text: "やぎの メエ", mc: who_confused }
          - { text: "りすの チロ", mc: who_confused }
        hint: "2つめの だんらくで、くだものが 出て くる ところを 読もう。"
      - ask: "やぎの メエは、ブウに なにを くれましたか。"
        answer: "サンドイッチの 半分"
        wrong:
          - { text: "どんぐりクッキー 二まい", mc: who_confused }
          - { text: "りんご 一こ", mc: who_confused }
          - { text: "メエの おべんとうばこ", mc: word_match }
        hint: "「やぎの メエは、」の あとを 読もう。"

  # ───── せつめい文 ─────
  - id: rd029
    genre: explain
    title: "糸電話の 作り方"
    text: |
      紙コップ 二つと 長い 糸を つかって、糸電話を 作りましょう。
      はじめに、紙コップの そこの まん中に、つまようじで 小さな あなを あけます。つぎに、その あなに 外がわから 糸を 通して、コップの 中で みじかく 切った つまようじに むすびます。もう 一つの コップにも、同じように 糸の はんたいがわを むすびます。
      さいごに、二人で コップを もって はなれ、糸を ぴんと はります。一人が コップに 口を あてて 話すと、もう 一人の コップから 声が 聞こえます。声で 糸が ふるえて、つたわるのです。
    questions:
      - ask: "紙コップの そこに あなを あける ときは、なにを つかいますか。"
        answer: "つまようじ"
        wrong:
          - { text: "はさみ", mc: not_in_text }
          - { text: "長い 糸", mc: wrong_part }
        hint: "「はじめに、」で はじまる 文を 読もう。"
      - ask: "つぎの うち、さいごに する ことは どれですか。"
        answer: "糸を ぴんと はる"
        wrong:
          - { text: "コップの そこに あなを あける", mc: wrong_part }
          - { text: "あなに 糸を 通す", mc: wrong_part }
          - { text: "さいごに 糸を 切る", mc: word_match }
        hint: "「はじめに」「つぎに」「さいごに」の じゅんに たしかめよう。"
      - ask: "声が つたわるのは、なにが ふるえるからですか。"
        answer: "ぴんと はった 糸"
        wrong:
          - { text: "紙コップの あな", mc: wrong_part }
          - { text: "二人の 手", mc: not_in_text }
          - { text: "みじかく 切った つまようじ", mc: wrong_part }
        hint: "さいごの だんらくの、おわりの 文を 読もう。"

  - id: rd030
    genre: explain
    title: "みつばちの しごと"
    text: |
      みつばちは、なかまと いっしょに すの 中で くらして います。一つの すに、何万びきもの はたらきばちが います。
      はたらきばちは、花から 花へ とんで、花の みつを あつめます。あつめた みつは すに はこばれ、はちみつに なります。
      よい 花ばたけを 見つけた はちは、すに もどると、おしりを ふりながら 八の 字を かくように おどります。この ダンスで、花の ある ほうや 遠さを なかまに 知らせるのです。
    questions:
      - ask: "はたらきばちは、花から なにを あつめますか。"
        answer: "花の みつ"
        wrong:
          - { text: "花の たね", mc: not_in_text }
          - { text: "花ばたけの ダンス", mc: word_match }
        hint: "2つめの だんらくの、はじめの 文を 読もう。"
      - ask: "はちが おしりを ふって おどるのは、なんの ためですか。"
        answer: "花の ある ばしょを 知らせる ため"
        wrong:
          - { text: "はちみつを 作る ため", mc: wrong_part }
          - { text: "なかまと あそぶ ため", mc: not_in_text }
          - { text: "おしりを 大きく する ため", mc: word_match }
        hint: "さいごの だんらくの、おわりの 文を 読もう。"
      - ask: "一つの すには、はたらきばちが どれくらい いますか。"
        answer: "何万びきも"
        wrong:
          - { text: "一ぴきだけ", mc: not_in_text }
          - { text: "八ぴき", mc: word_match }
        hint: "はじめの だんらくの、2つめの 文を 読もう。"

  - id: rd031
    genre: explain
    title: "ねこの ひげ"
    text: |
      ねこの 顔には、長い ひげが 生えて います。口の まわりだけで なく、目の 上や ほおにも あります。
      ひげの ねもとは とても びんかんで、少し ふれただけでも わかります。ねこは、せまい ところを 通る 前に、体が 通れる 広さか どうかを ひげで たしかめます。
      また、ひげで 風の ながれも 知る ことが できます。くらい 夜でも ものに ぶつからずに 歩けるのは、ひげの おかげなのです。
      だから、ねこの ひげを 切っては いけません。
    questions:
      - ask: "ねこの ひげは、口の まわりの ほかに どこに ありますか。"
        answer: "目の 上や ほお"
        wrong:
          - { text: "足の うら", mc: not_in_text }
          - { text: "ひげの ねもと", mc: word_match }
        hint: "はじめの だんらくの、2つめの 文を 読もう。"
      - ask: "せまい ところを 通る 前、ねこは ひげで なにを たしかめますか。"
        answer: "体が 通れる 広さか どうか"
        wrong:
          - { text: "くらい 夜の 道", mc: wrong_part }
          - { text: "ごはんの におい", mc: not_in_text }
          - { text: "ひげの 長さ", mc: word_match }
        hint: "2つめの だんらくの、さいごの 文を 読もう。"
      - ask: "くらい 夜でも ものに ぶつからずに 歩けるのは、なんの おかげですか。"
        answer: "ねこの ひげ"
        wrong:
          - { text: "よく 見える 目", mc: not_in_text }
          - { text: "風の ながれ", mc: wrong_part }
        hint: "3つめの だんらくの、おわりの 文を 読もう。"

  - id: rd032
    genre: explain
    title: "ペンギンの 子そだて"
    text: |
      南きょくに すむ コウテイペンギンは、とても さむい 冬に 子どもを そだてます。
      お母さんが たまごを 一つ うむと、お父さんが その たまごを 足の 上に のせます。そして、おなかの 下の あたたかい ところで つつみこみ、二か月ほど あたためつづけます。その 間、お父さんは 何も 食べません。
      その 間に、お母さんは 海へ 行って、魚などを たくさん 食べて きます。ひなが 生まれる ころに もどって きて、口から 食べものを 出して ひなに あたえます。
    questions:
      - ask: "たまごを 足の 上に のせて あたためるのは だれですか。"
        answer: "お父さん"
        wrong:
          - { text: "お母さん", mc: who_confused }
          - { text: "ひな", mc: who_confused }
        hint: "2つめの だんらくの、はじめの 文を 読もう。"
      - ask: "お父さんが たまごを あたためて いる 間、お母さんは なにを しますか。"
        answer: "海で 魚などを 食べて くる"
        wrong:
          - { text: "たまごを あたためる", mc: who_confused }
          - { text: "何も 食べずに まつ", mc: who_confused }
          - { text: "海で およぎ方を 教える", mc: word_match }
        hint: "3つめの だんらくの、はじめの 文を 読もう。"
      - ask: "お父さんが たまごを あたためるのは、どれくらいの 間ですか。"
        answer: "二か月ほど"
        wrong:
          - { text: "二日ほど", mc: not_in_text }
          - { text: "一年ほど", mc: not_in_text }
        hint: "2つめの だんらくの、2つめの 文を 読もう。"
