  - id: gr016
    sentence: "かえるが 池に ぽちゃんと とびこんだ。"
    ask: predicate
    answer: "とびこんだ"
    wrong:
      - { text: "かえるが", mc: subject_for_predicate }
      - { text: "ぽちゃんと", mc: modifier_chosen }
      - { text: "池に", mc: modifier_chosen }
    hint: "「どう した」に あたる、文の おわりの ことばだよ。"

  - id: gr017
    sentence: "あしたの 天気は 雨だ。"
    ask: predicate
    answer: "雨だ"
    wrong:
      - { text: "天気は", mc: subject_for_predicate }
      - { text: "あしたの", mc: modifier_chosen }
    hint: "「なんだ」に あたる ことばを さがそう。"

  - id: gr018
    sentence: "テストの 間、教室は とても しずかだ。"
    ask: predicate
    answer: "しずかだ"
    wrong:
      - { text: "教室は", mc: subject_for_predicate }
      - { text: "とても", mc: modifier_chosen }
      - { text: "テストの", mc: modifier_chosen }
    hint: "「どんなだ」に あたる、文の おわりの ことばだよ。"

  - id: gr019
    sentence: "朝ごはんに、母が パンを やいた。"
    ask: predicate
    answer: "やいた"
    wrong:
      - { text: "母が", mc: subject_for_predicate }
      - { text: "パンを", mc: modifier_chosen }
      - { text: "朝ごはんに", mc: modifier_chosen }
    hint: "「どう した」に あたる ことばは、文の おわりに あるよ。"

  - id: gr020
    sentence: "ティラノサウルスは 大きな きょうりゅうだ。"
    ask: predicate
    answer: "きょうりゅうだ"
    wrong:
      - { text: "ティラノサウルスは", mc: subject_for_predicate }
      - { text: "大きな", mc: modifier_chosen }
    hint: "「なんだ」に あたる ことばを、文の おわりから さがそう。"
