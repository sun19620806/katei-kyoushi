      - { text: "日曜日に", mc: modifier_chosen }
    hint: "「どう した」に あたる ことばを さがそう。"

  - id: gr015
    sentence: "あの 白い 鳥は はくちょうだ。"
    ask: predicate
    answer: "はくちょうだ"
    wrong:
      - { text: "鳥は", mc: subject_for_predicate }
      - { text: "白い", mc: modifier_chosen }
      - { text: "あの", mc: modifier_chosen }
