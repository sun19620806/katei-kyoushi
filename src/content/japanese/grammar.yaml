      - { text: "海に", mc: modifier_chosen }
    hint: "「なんだ」に あたる、文の いちばん おわりの ことばだよ。"

  - id: gr014
    sentence: "日曜日に、ぼくは おばあちゃんの 家へ 行った。"
    ask: predicate
