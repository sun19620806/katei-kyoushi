# 読みとり（つづき）。rd017〜rd024。小2 2学期。
# genre: story = ものがたり / explain = せつめい文
# text: 本文（150〜260文字、2〜4だんらく。だんらくは 改行で 分ける。文節ごとに スペース）
# questions: 1つの 文章に 3問。answer は 22文字以内。
#   wrong: まちがいの せんたくし。mc = その答えを えらぶ 原因（skills.yaml の misconceptions の id）
#   hint: 3だんめの ヒント（45文字以内）。答えも、まちがいの せんたくしも そのまま 書かない。
# 文章は すべて オリジナル。漢字は 小1・小2で 習う ものだけ。

passages:
  # ───── ものがたり ─────
  - id: rd017
    genre: story
    title: "とびばこの 四だん"
    text: |
      体いくの 時間に、とびばこの 四だんを とんだ。まなさんは 何ども とびばこの 上に すわって しまい、なきたい 気もちに なった。
      家で その 話を すると、兄の たくみさんが 「手は とびばこの 前の ほうに つくと いいよ。」と 教えて くれた。まなさんは、ふとんを かさねて 手を つく れんしゅうを した。
      つぎの 体いくの 時間、まなさんは 手を 前に ついて、えいっと ふみきった。体が ふわりと とびこえた。まなさんは 「やった。」と さけんだ。
    questions:
      - ask: "はじめ、まなさんが なきたい 気もちに なったのは どうしてですか。"
        answer: "とびばこの 上に すわって しまったから"
        wrong:
          - { text: "四だんを とびこえたから", mc: wrong_part }
          - { text: "兄に しかられたから", mc: not_in_text }
          - { text: "体いくの 時間が なかったから", mc: word_match }
        hint: "はじめの だんらくで、なきたい 気もちの すぐ 前を 読もう。"
      - ask: "手を つく ばしょを 教えて くれたのは だれですか。"
        answer: "兄の たくみさん"
        wrong:
          - { text: "まなさん", mc: who_confused }
          - { text: "体いくの 先生", mc: not_in_text }
        hint: "2つめの だんらくで、家で 話を 聞いた 人を さがそう。"
      - ask: "つぎの うち、いちばん さいごに あった ことは どれですか。"
        answer: "「やった。」と さけんだ"
        wrong:
          - { text: "ふとんで 手を つく れんしゅうを した", mc: wrong_part }
          - { text: "家で 兄に 話を した", mc: wrong_part }
          - { text: "ふとんを かさねて ねた", mc: word_match }
        hint: "さいごの だんらくの、おわりの 文を 読もう。"

  - id: rd018
    genre: story
    title: "おばあちゃんへの 手紙"
    text: |
      遠くに すむ おばあちゃんから、そらさんに 小さな にもつが とどいた。中には、手あみの 青い ぼうしが 入って いた。
      そらさんは、おれいの 手紙を 書く ことに した。まず 「ぼうし ありがとう。」と 書いた。つぎに、ぼうしを かぶった 自分の 絵を かいた。さいごに、ふうとうに おばあちゃんの 名前を 書いた。
      お父さんと いっしょに ポストへ 行き、手紙を 入れた。「早く とどくと いいな。」そらさんは わくわくしながら 家へ 帰った。
    questions:
      - ask: "おばあちゃんから とどいた にもつには、なにが 入って いましたか。"
        answer: "手あみの 青い ぼうし"
        wrong:
          - { text: "おれいの 手紙", mc: wrong_part }
          - { text: "青い 手ぶくろ", mc: not_in_text }
          - { text: "にもつを 入れる ポスト", mc: word_match }
        hint: "はじめの だんらくの、2つめの 文を 読もう。"
      - ask: "手紙を 書く とき、そらさんが 2ばんめに した ことは どれですか。"
        answer: "ぼうしを かぶった 自分の 絵を かいた"
        wrong:
          - { text: "ぼうし ありがとうと 書いた", mc: wrong_part }
          - { text: "ふうとうに 名前を 書いた", mc: wrong_part }
          - { text: "ぼうしを かぶって 出かけた", mc: word_match }
        hint: "「まず」「つぎに」「さいごに」の じゅんに たしかめよう。"
      - ask: "ポストに 手紙を 入れた あと、そらさんは どんな 気もちでしたか。"
        answer: "早く とどいて ほしくて わくわく"
        wrong:
          - { text: "おばあちゃんに 会えなくて さびしい", mc: not_in_text }
          - { text: "早く 家に 帰りたくて いそいで いる", mc: word_match }
        hint: "さいごの だんらくの、そらさんの ことばと その あとを 読もう。"

  - id: rd019
    genre: story
    title: "森の 音楽会"
    text: |
      森で 音楽会を ひらく ことに なった。うさぎは 歌を 歌い、小鳥は ふえを ふく。でも、きつねの コンは できる ことが 見つからなくて、しょんぼりして いた。
      すると、りすの クルミが、どんぐりを 入れた 小さな はこを もって きた。「これを ふると、いい 音が するよ。」コンが ふって みると、シャカシャカと 楽しい 音が した。
      音楽会の 日、コンは みんなの 歌に 合わせて、元気よく はこを ふった。森の みんなは 大きな はく手を おくった。
    questions:
      - ask: "「これを ふると、いい 音が するよ。」と 言ったのは だれですか。"
        answer: "りすの クルミ"
        wrong:
          - { text: "きつねの コン", mc: who_confused }
          - { text: "うさぎ", mc: who_confused }
        hint: "どんぐりを 入れた はこを もって きたのは だれかな。"
      - ask: "はじめ、コンが しょんぼりして いたのは どうしてですか。"
        answer: "できる ことが 見つからなかったから"
        wrong:
          - { text: "音楽会が なくなったから", mc: word_match }
          - { text: "森の みんなと けんかしたから", mc: not_in_text }
          - { text: "はこを うまく ふれなかったから", mc: wrong_part }
        hint: "はじめの だんらくの、さいごの 文を 読もう。"
      - ask: "音楽会の 日、コンは なにを しましたか。"
        answer: "歌に 合わせて はこを ふった"
        wrong:
          - { text: "ふえを ふいた", mc: who_confused }
          - { text: "大きな はく手を おくった", mc: wrong_part }
          - { text: "どんぐりを ひろいに 行った", mc: not_in_text }
        hint: "さいごの だんらくで、コンの ことが 書いて ある 文を 読もう。"

  - id: rd020
    genre: story
    title: "ねこの けしゴム"
    text: |
      二時間目の はじめ、ゆなさんは ふでばこを あけて びっくりした。お気に入りの ねこの 形の けしゴムが ない。ゆなさんは むねが どきどきして、つくえの 中を さがした。
      休み時間に なると、となりの せきの しょうたさんが 「いっしょに さがそう。」と 言って くれた。二人で 教室の ゆかを 見て 回ると、ロッカーの 前に けしゴムが おちて いた。
      ゆなさんは ほっと して、「見つけて くれて ありがとう。」と 言った。
    questions:
      - ask: "けしゴムが ないと 気づいた とき、ゆなさんは どんな ようすでしたか。"
        answer: "むねが どきどきして いた"
        wrong:
          - { text: "ほっと して いた", mc: wrong_part }
          - { text: "ねこを 見て びっくりした", mc: word_match }
          - { text: "おこって 大きな 声を 出した", mc: not_in_text }
        hint: "はじめの だんらくの、さいごの 文を 読もう。"
      - ask: "けしゴムは どこに おちて いましたか。"
        answer: "ロッカーの 前"
        wrong:
          - { text: "つくえの 中", mc: wrong_part }
          - { text: "ろうかの すみ", mc: not_in_text }
        hint: "2つめの だんらくの、おわりの 文を 読もう。"
      - ask: "「いっしょに さがそう。」と 言ったのは だれですか。"
        answer: "しょうたさん"
        wrong:
          - { text: "ゆなさん", mc: who_confused }
          - { text: "先生", mc: not_in_text }
        hint: "休み時間に なって、声を かけた 人を さがそう。"

  # ───── せつめい文 ─────
  - id: rd021
    genre: explain
    title: "つばめの す"
    text: |
      春に なると、つばめは あたたかい 南の 国から 日本へ やって きます。そして、家の 入り口の 上など、人の 近くに すを 作ります。
      すは、どろと かれ草で できて います。つばめは、口に くわえて きた どろを 少しずつ つみ上げて、おわんのような 形に します。
      人の 近くに すを 作るのは、からすや へびから たまごや ひなを まもる ためだと 考えられて います。
      ひなが 生まれると、親鳥は 虫を つかまえて きて、ひなに 食べさせます。
    questions:
      - ask: "つばめは、どこから 日本へ やって きますか。"
        answer: "あたたかい 南の 国"
        wrong:
          - { text: "さむい 北の 国", mc: not_in_text }
          - { text: "家の 入り口の 上", mc: wrong_part }
        hint: "はじめの だんらくの、さいしょの 文を 読もう。"
      - ask: "つばめの すは、なにで できて いますか。"
        answer: "どろと かれ草"
        wrong:
          - { text: "木の えだと 花", mc: not_in_text }
          - { text: "おわんと 口", mc: word_match }
          - { text: "虫と たまご", mc: wrong_part }
        hint: "2つめの だんらくの、はじめの 文を 読もう。"
      - ask: "人の 近くに すを 作るのは、どうしてだと 考えられて いますか。"
        answer: "からすや へびから まもる ため"
        wrong:
          - { text: "人から 虫を もらう ため", mc: not_in_text }
          - { text: "近くで どろを 作る ため", mc: word_match }
          - { text: "ひなに 虫を 食べさせる ため", mc: wrong_part }
        hint: "3つめの だんらくを 読みかえそう。"

  - id: rd022
    genre: explain
    title: "月の 形"
    text: |
      夜空の 月は、日に よって 形が かわって 見えます。
      月は、自分で 光って いるのでは ありません。お日さまの 光が あたって いる ところが、明るく 見えて いるのです。月が 地きゅうの まわりを 回るので、光って 見える ところが かわります。
      月が 見えない 日の あと、まず 細い 三日月が 見えます。つぎに 半分が 光る 半月、そして まるい まん月に なります。その あと、また 細く なって いき、やく 一か月で もとに もどります。
    questions:
      - ask: "月が 明るく 見えるのは どうしてですか。"
        answer: "お日さまの 光が あたって いるから"
        wrong:
          - { text: "月が 自分で 光って いるから", mc: word_match }
          - { text: "地きゅうの まわりを 回るから", mc: wrong_part }
          - { text: "星の 光を あつめて いるから", mc: not_in_text }
        hint: "2つめの だんらくの、はじめの 2つの 文を 読もう。"
      - ask: "三日月の つぎに 見えるのは どれですか。"
        answer: "半月"
        wrong:
          - { text: "まん月", mc: wrong_part }
          - { text: "月が 見えない 日", mc: wrong_part }
          - { text: "星の 形の 月", mc: word_match }
        hint: "さいごの だんらくで、「まず」「つぎに」の じゅんを 見よう。"
      - ask: "月の 形が もとに もどるまで、やく どれくらい かかりますか。"
        answer: "やく 一か月"
        wrong:
          - { text: "やく 一日", mc: not_in_text }
          - { text: "やく 一年", mc: not_in_text }
        hint: "さいごの だんらくの、おわりの ほうを 読もう。"

  - id: rd023
    genre: explain
    title: "虫の 足"
    text: |
      こん虫の 体は、頭・むね・はらの 三つに 分かれて います。足は 六本で、みんな むねから 出て います。
      足の 形は、虫の くらしに 合って います。ばったの 後ろ足は 長くて 太く、地めんを けって 遠くまで とびます。かまきりの 前足は かまのような 形で、えものを つかまえます。水に すむ げんごろうの 後ろ足には 毛が 生えて いて、水を かいて およぎます。
      くもは 足が 八本 あるので、こん虫では ありません。
    questions:
      - ask: "こん虫の 足は、体の どこから 出て いますか。"
        answer: "むね"
        wrong:
          - { text: "頭", mc: wrong_part }
          - { text: "はら", mc: wrong_part }
        hint: "はじめの だんらくの、2つめの 文を 読もう。"
      - ask: "えものを つかまえる 前足を もって いるのは どの 虫ですか。"
        answer: "かまきり"
        wrong:
          - { text: "ばった", mc: who_confused }
          - { text: "げんごろう", mc: who_confused }
          - { text: "くも", mc: who_confused }
        hint: "2つめの だんらくで、前足の 話が 出て くる 文を さがそう。"
      - ask: "げんごろうは、後ろ足を つかって なにを しますか。"
        answer: "水を かいて およぐ"
        wrong:
          - { text: "地めんを けって とぶ", mc: who_confused }
          - { text: "毛を 生やして ねむる", mc: word_match }
          - { text: "水から 出て 木に のぼる", mc: not_in_text }
        hint: "げんごろうの 後ろ足の ことが 書いて ある 文を 読もう。"

  - id: rd024
    genre: explain
    title: "くじらの くらし"
    text: |
      くじらは 海で くらして いますが、魚の なかまでは ありません。犬や 人と 同じ なかまです。
      魚は、水の 中で いきが できます。でも、くじらは 水の 中で いきが できません。ときどき 海の 上に 出て、頭の 上に ある はなの あなから いきを します。いきを はく とき、ふんすいのように しぶきが 上がります。
      くじらは たまごを うみません。お母さんは 子どもを 生んで、おちちで そだてます。
    questions:
      - ask: "くじらは、なんの なかまですか。"
        answer: "犬や 人と 同じ なかま"
        wrong:
          - { text: "魚の なかま", mc: word_match }
          - { text: "貝の なかま", mc: not_in_text }
        hint: "はじめの だんらくを さいごまで 読もう。"
      - ask: "くじらの はなの あなは、どこに ありますか。"
        answer: "頭の 上"
        wrong:
          - { text: "海の 上", mc: word_match }
          - { text: "口の 中", mc: not_in_text }
        hint: "2つめの だんらくで、はなの あなの 話を さがそう。"
      - ask: "くじらの 子どもは、なにで そだてられますか。"
        answer: "お母さんの おちち"
        wrong:
          - { text: "海の 中の 小さな 魚", mc: not_in_text }
          - { text: "ふんすいの しぶき", mc: wrong_part }
        hint: "さいごの だんらくの、2つめの 文を 読もう。"
