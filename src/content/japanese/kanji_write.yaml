# 漢字の書き（ひらがなの ところに 合う 漢字を えらぶ）。小2 2学期。
# reading: 漢字に する ひらがな（アプリは {blank} の ところに これを 出す）
# answer: 正しい 書き方（2年で習う漢字を ふくむ）
# sentence: {blank} を 1回だけ ふくむ 文
# wrong: まちがいの せんたくし。mc = その答えを えらぶ 原因（skills.yaml の misconceptions の id）
#   similar_kanji の せんたくしだけは、形の にた 3年いじょうの 漢字を つかって よい。
# hint: 3だんめの ヒント（45文字以内）。答えも、まちがいの せんたくしも そのまま 書かない。
# 文と ヒントの 漢字は 小1・小2で 習う ものだけ。

