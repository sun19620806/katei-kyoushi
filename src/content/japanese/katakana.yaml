# answer: 正しい かたかな / wrong: まちがいの せんたくし（ぜんぶ かたかな）
#   mc = その答えを えらぶ 原因（skills.yaml の misconceptions の id）
# hint: 3だんめの ヒント（45文字以内）。答えも、まちがいの せんたくしも そのまま 書かない。
# 国や 町の 名前、しょうひんの 名前は つかわない。

items:
