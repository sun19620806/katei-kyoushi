# 丸（。）・点（、）・かぎ（「」）。小2 2学期。
# type: mark = {blank} に 入る 記号を えらぶ / sentence = 記号の 使いかたが 正しい 文を えらぶ
# mark のとき: sentence に {blank} を 1回。answer と wrong は 記号（「。」「、」「「」「」」 など 1〜2文字）
# sentence のとき: sentence は なし。answer と wrong は 文ぜんたい（30文字以内）
# mc: period_comma（。と 、を 取りちがえる）/ quote_missing（話した ことばに かぎを つけない）/ quote_misplaced（かぎの 場所が ずれる・話して いない 所に つける）/ mark_position（。や 、を 文の とちゅうの 変な 場所に 打つ）
# hint: 3だんめの ヒント（45文字以内。答えの 記号を かぎかっこで そのまま 書かない）
# 答えが 、 や かぎの ときは、ヒントの 中にも その 記号を 使わない。
# 文章は すべて オリジナル。漢字は 小1・小2で 習う ものだけ。

items:
  # ───── mark：{blank} に 入る 記号 ─────
  - id: pu001
    type: mark
    sentence: "きのう こうえんへ 行きました{blank}"
    answer: "。"
    wrong:
      - { text: "、", mc: period_comma }
      - { text: "」", mc: quote_misplaced }
    hint: "文の おわりに つける しるしだよ。"

  - id: pu002
    type: mark
    sentence: "雨が ふって きたので{blank}家に 帰りました。"
    answer: "、"
    wrong:
      - { text: "。", mc: period_comma }
      - { text: "」", mc: quote_misplaced }
    hint: "文は まだ つづくよ。とちゅうで 一休みする しるしだよ。"

  - id: pu003
    type: mark
