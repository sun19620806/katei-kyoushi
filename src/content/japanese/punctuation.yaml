      - { text: "「", mc: quote_misplaced }
    hint: "ここで 文が おわるよ。おわりに つける しるしは どれかな。"

  - id: pu005
    type: mark
    sentence: "{blank}いっしょに 帰ろう。」と けんさんが 言った。"
    answer: "「"
