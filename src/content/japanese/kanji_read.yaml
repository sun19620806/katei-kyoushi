# 漢字の読み（線の 漢字の 読みを えらぶ）。小2 2学期。
# word: 2年で習う漢字を ふくむ ことば / reading: 正しい読み（ひらがな）
# sentence: {word} を 1回だけ ふくむ 文（{word} を 入れて 30文字以内）
# wrong: まちがいの せんたくし。mc = その答えを えらぶ 原因（skills.yaml の misconceptions の id）
# hint: 3だんめの ヒント（45文字以内）。答えの 読みも、まちがいの せんたくしも そのまま 書かない。
# 漢字は 小1・小2で 習う ものだけ。

items:
  - id: kr001
    word: "一週間"
    reading: "いっしゅうかん"
    sentence: "おばあちゃんの 家に {word} とまった。"
    wrong:
      - { text: "いちしゅうかん", mc: sokuon_miss }
      - { text: "いっしゆうかん", mc: youon_miss }
      - { text: "いっしゅかん", mc: long_vowel_miss }
    hint: "「いち」と「しゅう」が つながると、音が つまるよ。"

  - id: kr002
    word: "合体"
    reading: "がったい"
    sentence: "ロボットが {word}して 大きく なった。"
    wrong:
      - { text: "がたい", mc: sokuon_miss }
      - { text: "かったい", mc: dakuten_miss }
      - { text: "あいたい", mc: on_kun_mix }
    hint: "音を つなげて 読むと、小さい「っ」が 入るよ。"

  - id: kr003
