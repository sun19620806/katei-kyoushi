# ことばの いみ（はんたいの ことば・なかまの ことば）。小2 2学期。
# type: opposite = 「word」の はんたいの いみの ことばを えらぶ / group = 「word」の なかまに 入る ことばを えらぶ（word は なかまの 名前）
# answer: 正しい ことば / wrong: まちがいの せんたくし。mc は下の いずれか
#   similar_meaning: にた いみの ことばを 選ぶ（opposite で）
#   related_not_opposite: かんけいは あるが はんたいでは ない ことばを 選ぶ（opposite で）
#   group_other: ちがう なかまの ことばを 選ぶ（group で）
#   group_name: なかまの 名前そのものや、もっと 大きい なかまを 選ぶ（group で）
# hint: 3だんめの ヒント（45文字以内。答えを そのまま 書かない）
items:
