# 助詞「は・を・へ」（文に 合う 字を えらぶ）。小2 2学期。
# sentence: {blank} を 1回だけ ふくむ 文（30文字以内、分かち書き）
# answer: 正しい 字（は / を / へ、または わ / お / え が 正しい ことばの 一ぶの とき）
# wrong: まちがいの せんたくし。mc は下の いずれか
#   particle_sound: 音の とおりに 書いて しまう（「は」を「わ」、「を」を「お」、「へ」を「え」）
#   particle_overuse: ことばの 一ぶなのに「は・を・へ」を 使って しまう（例：「おかあさん」を「をかあさん」と 書く）
#   particle_other: ちがう じょし（が・に・で など）を 選ぶ（文に 合わない ものだけ）
# hint: 3だんめの ヒント（45文字以内、答えの 字を かぎかっこで そのまま 書かない）
# 「こんにちは」の「は」も、もとは じょしなので「は」と 書く。

items:
  # --- じょしの「は」 ---
  - id: pt001
    sentence: "ぼく{blank} こうえんへ 行きます。"
    answer: "は"
    wrong:
      - { text: "わ", mc: particle_sound }
      - { text: "を", mc: particle_other }
    hint: "「だれが」を あらわす ときの 字だよ。"

