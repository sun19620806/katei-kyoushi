  - id: rd012
    genre: story
    title: "一本の かさ"
    text: |
      朝は 晴れていたのに、学校が おわる ころ、強い 雨が ふり出した。かさを もって こなかった あおいさんは、げんかんで こまっていた。
      そこへ、となりの クラスの まさきさんが 来た。「ぼくの かさに 入って いこうよ。家が 同じ ほうだから。」あおいさんは ほっと した。
      二人で 一本の かさに 入って 歩くと、かたが 少し ぬれた。でも、あおいさんは なんだか 楽しく なった。家の 前で、あおいさんは 「ありがとう。」と 大きな 声で 言った。
    questions:
      - ask: "あおいさんが げんかんで こまっていたのは どうしてですか。"
        answer: "かさを もって こなかったから"
        wrong:
          - { text: "かたが ぬれたから", mc: wrong_part }
          - { text: "げんかんの 戸が あかなかったから", mc: word_match }
          - { text: "友だちと けんかしたから", mc: not_in_text }
        hint: "はじめの だんらくを 読みかえそう。"
      - ask: "「ぼくの かさに 入って いこうよ。」と 言ったのは だれですか。"
        answer: "まさきさん"
        wrong:
          - { text: "あおいさん", mc: who_confused }
          - { text: "あおいさんの お母さん", mc: not_in_text }
        hint: "2つめの だんらくで、そこへ 来た 人を さがそう。"
      - ask: "かさに 入って 歩いた とき、あおいさんは どんな 気もちに なりましたか。"
        answer: "なんだか 楽しく なった"
        wrong:
          - { text: "ほっと した", mc: wrong_part }
          - { text: "かたが ぬれて かなしく なった", mc: word_match }
        hint: "「でも、」の あとに 書いて ある ことを 読もう。"

  # ───── せつめい文（つづき） ─────
  - id: rd013
    genre: explain
    title: "たんぽぽの わた毛"
    text: |
      たんぽぽの 黄色い 花は、何日か すると しぼみます。花の じくは、地めんに たおれます。でも、かれて しまったのでは ありません。じくの 先で、たねを そだてて いるのです。
      やがて、花の あとに 白い わた毛が できます。すると、たおれて いた じくが また 立ち上がり、前よりも 高く のびます。高い ほうが 風に よく あたって、わた毛を 遠くまで とばせるからです。
      晴れて 風の ある 日、わた毛は 大きく ひらいて、たねを のせて とんで いきます。
    questions:
      - ask: "花が しぼんだ あと、じくは どう なりますか。"
        answer: "地めんに たおれる"
        wrong:
          - { text: "前よりも 高く のびる", mc: wrong_part }
          - { text: "かれて しまう", mc: word_match }
          - { text: "赤い 色に かわる", mc: not_in_text }
        hint: "はじめの だんらくの、2つめの 文を 読もう。"
      - ask: "じくが 高く のびるのは どうしてですか。"
        answer: "風に よく あたって とばせるから"
        wrong:
          - { text: "たねを そだてて いるから", mc: wrong_part }
          - { text: "もう 一ど 花を さかせるから", mc: not_in_text }
        hint: "2つめの だんらくの、さいごの 文を 読もう。"
      - ask: "たおれた あと、また 立ち上がって 高く のびるのは なにですか。"
        answer: "花の じく"
        wrong:
          - { text: "白い わた毛", mc: who_confused }
          - { text: "黄色い 花", mc: who_confused }
        hint: "「立ち上がり」の 前に 書いて ある ことばを 見よう。"

  - id: rd014
    genre: explain
    title: "かたつむりの ひみつ"
    text: |
      かたつむりは、貝の なかまです。体が やわらかく、かわいた ところが にがてなので、雨の 日や しめった 草むらで よく 見つかります。
      頭には、長い つのと みじかい つのが 二本ずつ あります。長い つのの 先には、目が あります。みじかい つので、ものの においや あじを たしかめます。
      かたつむりは、体から ねばねばした えきを 出しながら、すべるように すすみます。晴れた 日が つづくと、からの 中に 入り、入り口に うすい まくを はって じっと しています。
    questions:
      - ask: "かたつむりは、なんの なかまですか。"
        answer: "貝の なかま"
        wrong:
          - { text: "虫の なかま", mc: not_in_text }
          - { text: "草むらの 草", mc: word_match }
        hint: "はじめの だんらくの、さいしょの 文を 読もう。"
      - ask: "かたつむりの 目は どこに ありますか。"
        answer: "長い つのの 先"
        wrong:
          - { text: "みじかい つのの 先", mc: who_confused }
          - { text: "からの 入り口", mc: wrong_part }
        hint: "2つめの だんらくで、つのの 話を 読みかえそう。"
      - ask: "晴れた 日が つづくと、かたつむりは どう しますか。"
        answer: "からに 入って じっと する"
        wrong:
          - { text: "えきを 出して すすむ", mc: wrong_part }
          - { text: "雨を さがして 遠くへ 行く", mc: not_in_text }
          - { text: "晴れた 草むらで 休む", mc: word_match }
        hint: "さいごの だんらくの、さいごの 文を 読もう。"

  - id: rd015
    genre: explain
    title: "こおろぎの 鳴き声"
    text: |
      秋の 夜、草むらから 「コロコロ リー。」と いう 音が 聞こえて きます。こおろぎの 鳴き声です。
      こおろぎは、口で 鳴いて いるのでは ありません。せなかの はねを 立てて、左右の はねを こすり合わせて 音を 出して います。はねには ぎざぎざした ところが あって、そこが こすれると 音が 出るのです。
      鳴くのは おすだけです。おすは、鳴いて めすに 自分の いる ばしょを 知らせます。めすは、前足に ある 耳で その 音を 聞きます。
    questions:
      - ask: "こおろぎは、どうやって 音を 出しますか。"
        answer: "左右の はねを こすり合わせて"
        wrong:
          - { text: "口を 大きく あけて", mc: word_match }
          - { text: "前足を ならして", mc: wrong_part }
          - { text: "草を ゆらして", mc: not_in_text }
        hint: "2つめの だんらくを 読みかえそう。"
      - ask: "鳴くのは、おすと めすの どちらですか。"
        answer: "おす"
        wrong:
          - { text: "めす", mc: who_confused }
          - { text: "おすも めすも", mc: not_in_text }
        hint: "さいごの だんらくの、はじめの 文を 読もう。"
      - ask: "めすの 耳は どこに ありますか。"
        answer: "前足"
        wrong:
          - { text: "せなかの はね", mc: wrong_part }
          - { text: "頭の 上", mc: not_in_text }
        hint: "さいごの だんらくの、さいごの 文を 読もう。"

  - id: rd016
    genre: explain
    title: "お米が できるまで"
    text: |
      わたしたちが 食べる お米は、いねと いう 草の みです。
      春に なると、まず もみと いう たねを まいて、なえを そだてます。田んぼに 水を 入れて 土を たいらに したら、そだった なえを うえます。これを 田うえと いいます。
      夏の 間、いねは ぐんぐん のびます。夏の おわりには 小さな 花が さいて、やがて みが できます。
      秋に なると、いねは 黄色く なります。かりとった いねを かわかし、みの からを とると、お米に なります。
    questions:
      - ask: "田うえでは、なにを うえますか。"
        answer: "そだった なえ"
        wrong:
          - { text: "もみと いう たね", mc: wrong_part }
          - { text: "田んぼの 水", mc: word_match }
          - { text: "やさいの たね", mc: not_in_text }
        hint: "2つめの だんらくの「うえます」の 前を 読もう。"
      - ask: "つぎの うち、いちばん さいしょに する ことは どれですか。"
        answer: "もみを まいて なえを そだてる"
        wrong:
          - { text: "田んぼに なえを うえる", mc: wrong_part }
          - { text: "いねを かりとる", mc: wrong_part }
          - { text: "みの からを とる", mc: wrong_part }
        hint: "「まず」と いう ことばの あとを 読もう。"
      - ask: "秋に なって 黄色く なるのは なにですか。"
        answer: "いね"
        wrong:
          - { text: "なえ", mc: who_confused }
          - { text: "小さな 花", mc: who_confused }
        hint: "さいごの だんらくの、はじめの 文を 読もう。"
