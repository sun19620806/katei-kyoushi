# 読みとり（文章を 読んで 問題に 答える）。小2 2学期。
# genre: story = ものがたり / explain = せつめい文
# text: 本文（150〜260文字、2〜4だんらく。だんらくは 改行で 分ける。文節ごとに スペース）
# questions: 1つの 文章に 3問。answer は 22文字以内。
#   wrong: まちがいの せんたくし。mc = その答えを えらぶ 原因（skills.yaml の misconceptions の id）
#   hint: 3だんめの ヒント（45文字以内）。答えも、まちがいの せんたくしも そのまま 書かない。
# 文章は すべて オリジナル。漢字は 小1・小2で 習う ものだけ。

passages:
  # ───── ものがたり ─────
  - id: rd001
    genre: story
    title: "ひまわりの たね"
    text: |
      春の ある 日、ゆいさんは おじいちゃんと にわに ひまわりの たねを まいた。おじいちゃんは 「毎日 水を あげてね。」と 言った。ゆいさんは 毎朝 じょうろで 水を あげた。
      夏に なると、ひまわりは ゆいさんの せより ずっと 高く なった。大きな 黄色い 花を 見て、弟の そうたさんが 「おひさまみたい。」と 言った。
      秋に なって 花が かれると、まん中に たねが たくさん できた。ゆいさんは たねを ふくろに 入れて、「来年も いっしょに まこうね。」と おじいちゃんに 言った。
    questions:
      - ask: "ゆいさんは 毎朝 なにを しましたか。"
        answer: "じょうろで 水を あげた"
        wrong:
          - { text: "たねを ふくろに 入れた", mc: wrong_part }
          - { text: "毎朝 花の 絵を かいた", mc: word_match }
          - { text: "にわの 草を ぬいた", mc: not_in_text }
        hint: "はじめの だんらくを 読みかえそう。"
      - ask: "「おひさまみたい。」と 言ったのは だれですか。"
        answer: "弟の そうたさん"
        wrong:
          - { text: "ゆいさん", mc: who_confused }
          - { text: "おじいちゃん", mc: who_confused }
        hint: "夏の だんらくで、花を 見て 言った 人を さがそう。"
      - ask: "秋に なって、花の まん中に なにが できましたか。"
        answer: "たくさんの たね"
        wrong:
          - { text: "大きな 黄色い 花", mc: wrong_part }
          - { text: "あまい くだもの", mc: not_in_text }
        hint: "さいごの だんらくを 読みかえそう。"

  - id: rd002
    genre: story
    title: "ごめんねの 一言"
    text: |
      休み時間に、りくさんと こうたさんは 校ていで サッカーを した。こうたさんが けった ボールが、りくさんの 顔に あたって しまった。りくさんは おこって、先に 教室へ もどった。
      こうたさんは 「ごめんね。」と 言いたかったけれど、なかなか 言えなかった。すると、同じ クラスの めいさんが 「いっしょに 行こう。」と 言って、こうたさんの 手を 引いた。
      教室に つくと、こうたさんは 小さな 声で 「さっきは ごめんね。」と 言った。りくさんは にっこり して、「あしたも サッカー しようね。」と 答えた。
    questions:
      - ask: "ボールが 顔に あたったのは だれですか。"
        answer: "りくさん"
        wrong:
          - { text: "こうたさん", mc: who_confused }
          - { text: "めいさん", mc: who_confused }
        hint: "ボールを けった 人と、あたった 人を 分けて 考えよう。"
      - ask: "めいさんは こうたさんに なんと 言いましたか。"
        answer: "いっしょに 行こう"
        wrong:
          - { text: "さっきは ごめんね", mc: who_confused }
          - { text: "あしたも サッカー しようね", mc: wrong_part }
          - { text: "めいさんも サッカーを したい", mc: word_match }
        hint: "2つめの だんらくを 読みかえそう。"
      - ask: "こうたさんが りくさんに あやまったのは どこですか。"
        answer: "教室"
        wrong:
          - { text: "校てい", mc: wrong_part }
          - { text: "ろうか", mc: not_in_text }
        hint: "さいごの だんらくの はじめを 見よう。"

  - id: rd003
    genre: story
    title: "雪の 日の だるま"
    text: |
      ある 冬の 朝、うさぎの ミミが 目を さますと、森は まっ白な 雪で おおわれていた。ミミは うれしくて、友だちの くまの ゴロを よびに 行った。
      ゴロの 家に つくと、ゴロは まだ ねむそうだった。でも、雪を 見ると 目を かがやかせて、外へ とび出した。二人は 雪で 大きな だるまを 作った。
      だるまが できると、ゴロは 自分の 赤い マフラーを だるまの 首に まいた。「これで さむくないね。」ミミと ゴロは 顔を 見合わせて わらった。
    questions:
      - ask: "ミミが 目を さますと、森は どう なっていましたか。"
        answer: "まっ白な 雪で おおわれていた"
        wrong:
          - { text: "大きな だるまが 立っていた", mc: wrong_part }
          - { text: "森の 木に 花が さいていた", mc: word_match }
          - { text: "ゴロが 外で まっていた", mc: not_in_text }
        hint: "はじめの だんらくを 読みかえそう。"
      - ask: "だるまに マフラーを まいたのは だれですか。"
        answer: "くまの ゴロ"
        wrong:
          - { text: "うさぎの ミミ", mc: who_confused }
          - { text: "ミミの お母さん", mc: not_in_text }
        hint: "「自分の 赤い マフラー」が だれの ものか 考えよう。"
      - ask: "外へ 出た あと、二人は まず なにを しましたか。"
        answer: "雪で 大きな だるまを 作った"
        wrong:
          - { text: "だるまに マフラーを まいた", mc: wrong_part }
          - { text: "雪がっせんを した", mc: not_in_text }
          - { text: "外へ 出て すぐに 家へ もどった", mc: word_match }
        hint: "2つめの だんらくの おわりを 見よう。"

  - id: rd004
    genre: story
    title: "はじめての おつかい"
    text: |
      日曜日の 午後、ひなさんは はじめて 一人で おつかいに 行った。お母さんに たのまれたのは、牛にゅうと たまごだ。
      店に つくと、ひなさんは まず 牛にゅうを かごに 入れた。つぎに たまごを さがしたけれど、なかなか 見つからない。こまっていると、店の おばさんが 「たまごは おくの たなだよ。」と 教えてくれた。
      家に 帰ると、お母さんが 「一人で できたね。」と 言って、ひなさんの 頭を なでた。ひなさんは むねを はって、「つぎは パンも 買ってくるね。」と 言った。
    questions:
      - ask: "店で、ひなさんが さいしょに かごに 入れた ものは どれですか。"
        answer: "牛にゅう"
        wrong:
          - { text: "たまご", mc: wrong_part }
          - { text: "パン", mc: wrong_part }
          - { text: "かご", mc: word_match }
        hint: "「まず」と いう ことばの あとを 見よう。"
      - ask: "たまごの ばしょを 教えてくれたのは だれですか。"
        answer: "店の おばさん"
        wrong:
          - { text: "お母さん", mc: who_confused }
          - { text: "店の おじさん", mc: not_in_text }
        hint: "2つめの だんらくで、こまった あとを 読もう。"
      - ask: "お母さんが ひなさんの 頭を なでたのは どうしてですか。"
        answer: "一人で おつかいが できたから"
        wrong:
          - { text: "パンを 買ってきたから", mc: wrong_part }
          - { text: "頭が いたかったから", mc: word_match }
          - { text: "たまごを わったから", mc: not_in_text }
        hint: "お母さんが 言った ことばを 読みかえそう。"

  # ───── せつめい文 ─────
  - id: rd005
    genre: explain
    title: "ありの すの 中"
    text: |
      ありの すは、土の 中に あります。入り口は 小さな あなですが、中には 長い 通り道が あって、たくさんの へやに つながっています。
      へやには、それぞれ やくめが あります。たまごや 子どもの ありを そだてる へや、あつめた 食べものを しまっておく へや、ごみを すてる へやなどです。
      すの 中には、女王ありが います。女王ありは、たまごを うむ しごとを します。はたらきありは、食べものを 見つけて はこんだり、子どもの せわを したり します。
      こうして、ありたちは 力を 合わせて くらしているのです。
    questions:
      - ask: "ありの すは どこに ありますか。"
        answer: "土の 中"
        wrong:
          - { text: "木の 上", mc: not_in_text }
          - { text: "食べものを しまう へや", mc: wrong_part }
        hint: "はじめの だんらくの、さいしょの 文を 読もう。"
      - ask: "たまごを うむ しごとを するのは だれですか。"
        answer: "女王あり"
        wrong:
          - { text: "はたらきあり", mc: who_confused }
          - { text: "子どもの あり", mc: who_confused }
        hint: "3つめの だんらくを 読みかえそう。"
      - ask: "はたらきありは どんな しごとを しますか。"
        answer: "食べものを 見つけて はこぶ"
        wrong:
          - { text: "たまごを うむ", mc: who_confused }
          - { text: "すの 入り口を 大きく する", mc: not_in_text }
          - { text: "しごとを 休んで ねる", mc: word_match }
        hint: "「はたらきありは、」の あとを 読もう。"

  - id: rd006
    genre: explain
    title: "パンが できるまで"
    text: |
      パンは、小麦こから 作ります。小麦こは、麦の みを こなに した ものです。
      まず、小麦こに 水や しお、イーストを 入れて、よく こねます。イーストは、きじを ふくらませる 小さな 生きものです。こねた きじを あたたかい ところに おいておくと、ぷっくりと ふくらみます。
      つぎに、きじを 食べやすい 大きさに 分けて、形を ととのえます。もう 一ど ふくらませてから、さいごに オーブンで やきます。
      やきあがった パンの 中には、小さな あなが たくさん あって、ふんわりと しています。
    questions:
      - ask: "イーストは、なにを する ものですか。"
        answer: "きじを ふくらませる"
        wrong:
          - { text: "オーブンで パンを やく", mc: wrong_part }
          - { text: "麦の みを こなに する", mc: wrong_part }
          - { text: "イーストを 入れて まぜる", mc: word_match }
        hint: "「イーストは、」で はじまる 文を さがそう。"
      - ask: "こねた きじは、どこに おいておきますか。"
        answer: "あたたかい ところ"
        wrong:
          - { text: "つめたい ところ", mc: not_in_text }
          - { text: "オーブンの 中", mc: wrong_part }
        hint: "2つめの だんらくの おわりを 読もう。"
      - ask: "パンを 作る とき、さいごに する ことは どれですか。"
        answer: "オーブンで やく"
        wrong:
          - { text: "よく こねる", mc: wrong_part }
          - { text: "形を ととのえる", mc: wrong_part }
          - { text: "さいごに 小麦こを 入れる", mc: word_match }
        hint: "3つめの だんらくの おわりの 文を 読もう。"

  - id: rd007
    genre: explain
    title: "雪が ふる わけ"
    text: |
      空に うかぶ 雲は、とても 小さな 水や こおりの つぶが たくさん あつまって できています。
      空の 高い ところは、とても さむいです。雲の 中の こおりの つぶは、空気の 中の 水分を くっつけて、少しずつ 大きく なります。
      大きく なった つぶは、おもく なって 下へ おちてきます。地めんの 近くまで ずっと さむいと、とけないで 雪の まま ふってきます。とちゅうで とけると、雨に なります。
      雪を よく 見ると、六つの かどが ある きれいな 形を している ことが あります。
    questions:
      - ask: "雲は、なにが あつまって できていますか。"
        answer: "小さな 水や こおりの つぶ"
        wrong:
          - { text: "白い わた", mc: not_in_text }
          - { text: "六つの かどが ある 雪", mc: wrong_part }
        hint: "はじめの だんらくを 読みかえそう。"
      - ask: "つぶが 下へ おちてくるのは どうしてですか。"
        answer: "大きく なって おもく なるから"
        wrong:
          - { text: "空の 高い ところが さむいから", mc: wrong_part }
          - { text: "下へ おりたく なるから", mc: word_match }
          - { text: "風が 雲を ゆらすから", mc: not_in_text }
        hint: "3つめの だんらくの はじめを 読もう。"
      - ask: "雪ではなく 雨に なるのは、どんな ときですか。"
        answer: "おちる とちゅうで とけた とき"
        wrong:
          - { text: "地めんの 近くまで ずっと さむい とき", mc: wrong_part }
          - { text: "雲が 大きく なった とき", mc: not_in_text }
          - { text: "雨に なりたい とき", mc: word_match }
        hint: "3つめの だんらくの、さいごの 文を 読もう。"

  - id: rd008
    genre: explain
    title: "おたまじゃくしから かえるへ"
    text: |
      春に なると、かえるは 池や 田んぼの 水の 中に たまごを うみます。たまごは、ゼリーのような ものに つつまれています。
      しばらく すると、たまごから おたまじゃくしが 生まれます。おたまじゃくしには 足が なく、長い しっぽを うごかして 水の 中を およぎます。
      大きく なると、まず 後ろ足が 出てきます。つぎに 前足が 出てきます。そして、しっぽが だんだん みじかく なっていきます。
      しっぽが なくなると、かえるに なります。こんどは 水から 出て、土の 上でも くらせるように なります。
    questions:
      - ask: "かえるは、どこに たまごを うみますか。"
        answer: "池や 田んぼの 水の 中"
        wrong:
          - { text: "土の 上", mc: wrong_part }
          - { text: "木の はっぱの うら", mc: not_in_text }
          - { text: "かえるの すの 中", mc: word_match }
        hint: "はじめの だんらくを 読みかえそう。"
      - ask: "おたまじゃくしに、さいしょに 出てくるのは どこですか。"
        answer: "後ろ足"
        wrong:
          - { text: "前足", mc: wrong_part }
          - { text: "しっぽ", mc: wrong_part }
          - { text: "おたまじゃくしの 目", mc: word_match }
        hint: "3つめの だんらくで、「まず」の あとを 読もう。"
      - ask: "おたまじゃくしは、どうやって およぎますか。"
        answer: "長い しっぽを うごかして"
        wrong:
          - { text: "後ろ足で 水を けって", mc: wrong_part }
          - { text: "口から 水を 出して", mc: not_in_text }
          - { text: "およぐ れんしゅうを して", mc: word_match }
        hint: "2つめの だんらくを 読みかえそう。"
